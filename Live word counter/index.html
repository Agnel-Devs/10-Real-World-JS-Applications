<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Word counter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wrapper">
        <div class="container">
            <textarea name="" id="input" rows="12" placeholder="Start Typing...."></textarea>
        </div>
            <div class="count">
            <div>
                <h5 id="wordcount">0</h5>
                <p>Words</p>
            </div>
            <div>
                <div>
                <h5 id="charcount">0</h5>
                <p>Characters</p>
            </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stop watch & Timer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 class="title">Stop watch timer</h1>
        <div class="stopwatch">
            <div class="timer">
              <span id="minutes">00</span>: 
              <span id="seconds">00</span>: 
              <span id="milliseconds">00</span>  
            </div>
            <div class="control">
               <button id="startbtn">Start</button>
               <button id="stopbtn">Stop</button>
               <button id="paubtn">Pause</button>
               <button id="resbtn">Reset</button>
            </div>
            <div class="laps">
                <h2 class="laptitle">Lap Timer</h2>
                <ul id="laplist"></ul>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
